<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3D35" />
      <stop offset="50%" stop-color="#062621" />
      <stop offset="100%" stop-color="#041B18" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#C8A45D" />
      <stop offset="100%" stop-color="#8C6D2B" />
    </linearGradient>

    <pattern id="islamicGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 40 20 L 20 40 L 0 20 Z" fill="none" stroke="#C8A45D" stroke-width="0.75" stroke-opacity="0.15" />
      <circle cx="20" cy="20" r="2.5" fill="#C8A45D" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="600" height="800" fill="url(#bgGrad)" />
  <rect width="600" height="800" fill="url(#islamicGrid)" />

  <!-- Outer Gold Foil Border -->
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="url(#goldGrad)" stroke-width="3" rx="16" />
  <rect x="30" y="30" width="540" height="740" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.5" rx="12" />

  <!-- Corner Filigree Circles -->
  <circle cx="40" cy="40" r="6" fill="url(#goldGrad)" />
  <circle cx="560" cy="40" r="6" fill="url(#goldGrad)" />
  <circle cx="40" cy="760" r="6" fill="url(#goldGrad)" />
  <circle cx="560" cy="760" r="6" fill="url(#goldGrad)" />

  <!-- Islamic Arch Silhouette -->
  <path d="M 100 720 L 100 300 C 100 150, 300 80, 300 80 C 300 80, 500 150, 500 300 L 500 720 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.7" />

  <!-- Center Royal Crest & Monogram -->
  <g transform="translate(300, 360)">
    <circle cx="0" cy="0" r="105" fill="#0B3D35" stroke="url(#goldGrad)" stroke-width="3.5" />
    <circle cx="0" cy="0" r="95" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6 4" />
    
    <!-- Monogram Emblem -->
    <text x="0" y="18" font-family="'Cormorant Garamond', Georgia, serif" font-size="58" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">A &amp; A</text>
  </g>

  <!-- Crown / Crescent Decorative Ornament -->
  <path d="M 270 210 L 285 190 L 300 210 L 315 190 L 330 210 L 330 225 L 270 225 Z" fill="url(#goldGrad)" />

  <!-- Royal Labels -->
  <text x="300" y="530" font-family="'Cormorant Garamond', Georgia, serif" font-size="32" font-weight="700" fill="#F8F3E7" text-anchor="middle" letter-spacing="4">ADNAN &amp; ALEENA</text>
  <text x="300" y="570" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#C8A45D" text-anchor="middle" letter-spacing="5">COUPLE PHOTOGRAPHY FRAME</text>
  <text x="300" y="615" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#F8F3E7" opacity="0.65" text-anchor="middle">Place couple portrait at public/assets/images/couple-portrait.jpg</text>
</svg>
